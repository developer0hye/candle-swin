# Supply-chain gate for .github/workflows/cargo-deny.yml.
# Vulnerability advisories always fail; RustSec also files known-malicious
# crates (e.g. the 2026-08-20 arrayref / proc-macro1 attack). Yanked versions
# fail too. Licenses and bans are not checked here.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "none"
unsound = "workspace"
ignore = [
  # Temporary. candle-core 0.11.1 was published 2026-10-31, so it clears the
  # 7-day dependency age rule on 2026-11-07. Remove these entries with that
  # upgrade.
  { id = "RUSTSEC-2026-0367", reason = "zip 7.2 is pinned by candle-core 0.9 (^7.2), which only reads npy/pickle archives through ZipArchive and never calls extract(), the path this advisory covers; fixed by moving to candle-core >=0.11.1 (zip ^9.1.3)" },
  { id = "RUSTSEC-2026-0368", reason = "zip 7.2 is pinned by candle-core 0.9 (^7.2), which only reads npy/pickle archives through ZipArchive and never calls extract(), the path this advisory covers; fixed by moving to candle-core >=0.11.1 (zip ^9.1.3)" },
  { id = "RUSTSEC-2026-0369", reason = "zip 7.2 is pinned by candle-core 0.9 (^7.2), which only reads npy/pickle archives through ZipArchive and never calls extract(), the path this advisory covers; fixed by moving to candle-core >=0.11.1 (zip ^9.1.3)" },
]
